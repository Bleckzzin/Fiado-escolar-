name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: node scripts/patch-android.mjs
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
      - run: npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk fiado-escolar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fiado-escolar-apk
          path: fiado-escolar.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Fiado Escolar APK ${{ github.run_number }}
          files: fiado-escolar.apk
